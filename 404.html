<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moved — Lone Star Ballot</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10263E;
      color: #F6F1E7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 12px; }
    p { margin: 0 0 18px; color: #BCD0E4; }
    a { color: #E07A5E; }
    ul { list-style: none; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    li a {
      display: inline-block;
      padding: 8px 16px;
      border: 1px solid rgba(188, 208, 228, .4);
      border-radius: 999px;
      text-decoration: none;
      color: #F6F1E7;
      font-weight: 600;
      font-size: .9rem;
    }
    li a:hover { border-color: #E07A5E; color: #E07A5E; }
  </style>
  <script>
    (function () {
      var YEARS = ['2026', '2025', '2024', '2023', '2022', '2021', '2020'];
      var path = location.pathname.toLowerCase();
      var dest = '/';

      // Old WordPress poll pages, e.g. /poll/2025-lone-star-board-ballot/
      // and /poll/2020-board/ -> the matching archive year.
      var m = path.match(/\/poll\/(20\d{2})/);
      if (m && YEARS.indexOf(m[1]) !== -1) {
        dest = '/#' + m[1];
      }

      // Everything else (homepage, /feed/, /wp-json/, /xmlrpc.php, …)
      // lands on the archive homepage.
      location.replace(dest);
    })();
  </script>
</head>
<body>
  <main>
    <h1>This page has moved</h1>
    <p>Taking you to the Lone Star Ballot results archive…</p>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/#2026">2026</a></li>
      <li><a href="/#2025">2025</a></li>
      <li><a href="/#2024">2024</a></li>
      <li><a href="/#2023">2023</a></li>
      <li><a href="/#2022">2022</a></li>
      <li><a href="/#2021">2021</a></li>
      <li><a href="/#2020">2020</a></li>
    </ul>
  </main>
</body>
</html>
